<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEBCODE — Image to QR Code</title>
  <meta name="description" content="WEBCODE — upload an image and instantly get a QR code that links to your image online." />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="WEBCODE — Image to QR Code" />
  <meta property="og:description" content="Upload an image and receive a QR code linking to the image hosted online." />
  <meta property="og:type" content="website" />
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Upload an Image</h1>
      <p>WEBCODE instantly hosts your image and returns a QR code that opens it.</p>

      <div id="trialCard" class="paywall-card">
        <div>
          <p class="paywall-title">3-Day Free Trial</p>
          <p id="trialText" class="paywall-copy">Start your free trial to create image QR codes with WEBCODE.</p>
        </div>
        <div class="paywall-actions">
          <button id="startTrialButton" class="btn secondary" type="button">Start Free Trial</button>
          <button id="upgradeButton" class="btn primary hidden" type="button">Upgrade Now</button>
        </div>
      </div>

      <form id="uploadForm" class="form-row" aria-label="Upload image form">
        <div class="file-input-wrapper">
          <label for="imageInput" style="display:block;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,0.85)">Choose image</label>
          <input type="file" id="imageInput" name="image" accept="image/*" required />
        </div>

        <div class="controls">
          <button id="submitButton" class="btn primary" type="submit">Upload & Generate QR</button>
          <div id="spinner" class="spinner hidden" aria-hidden="true"></div>
        </div>
      </form>

      <section id="result" class="result-card hidden" aria-live="polite">
        <h2 style="margin-top:0;color:rgba(255,255,255,0.9)">Generated QR Code</h2>
        <div class="qr-preview">
          <img id="qrImage" alt="QR code" />
          <div style="flex:1">
            <p style="margin:0 0 8px 0;color:rgba(255,255,255,0.8)"><strong>Image URL:</strong></p>
            <a id="imageLink" class="meta-link" target="_blank" rel="noreferrer">--</a>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const uploadForm = document.getElementById('uploadForm');
    const imageInput = document.getElementById('imageInput');
    const resultSection = document.getElementById('result');
    const imageLink = document.getElementById('imageLink');
    const qrImage = document.getElementById('qrImage');
    const submitButton = document.getElementById('submitButton');
    const spinner = document.getElementById('spinner');
    const trialText = document.getElementById('trialText');
    const startTrialButton = document.getElementById('startTrialButton');
    const upgradeButton = document.getElementById('upgradeButton');
    const freeTrialDays = 3;
    const trialKey = 'webcodeTrialStart';

    const trialStart = localStorage.getItem(trialKey);

    function setLoading(loading) {
      if (loading) {
        submitButton.disabled = true;
        submitButton.classList.add('is-loading');
        spinner.classList.remove('hidden');
      } else {
        submitButton.disabled = false;
        submitButton.classList.remove('is-loading');
        spinner.classList.add('hidden');
      }
    }

    function getTrialStart() {
      return localStorage.getItem(trialKey);
    }

    function setTrialStart() {
      localStorage.setItem(trialKey, new Date().toISOString());
    }

    function getDaysLeft() {
      const start = getTrialStart();
      if (!start) return 0;
      const elapsedMs = Date.now() - new Date(start).getTime();
      const remaining = freeTrialDays * 24 * 60 * 60 * 1000 - elapsedMs;
      return remaining > 0 ? Math.ceil(remaining / (24 * 60 * 60 * 1000)) : 0;
    }

    function renderTrialState() {
      const started = !!getTrialStart();
      const daysLeft = getDaysLeft();

      if (!started) {
        trialText.textContent = `Start your free ${freeTrialDays}-day trial to create QR codes from images.`;
        upgradeButton.classList.add('hidden');
        startTrialButton.classList.remove('hidden');
      } else if (daysLeft > 0) {
        trialText.textContent = `Your free trial is active. ${daysLeft} day${daysLeft === 1 ? '' : 's'} remaining.`;
        startTrialButton.classList.add('hidden');
        upgradeButton.classList.add('hidden');
      } else {
        trialText.textContent = 'Your 3-day trial has ended. Upgrade to continue using WEBCODE.';
        startTrialButton.classList.add('hidden');
        upgradeButton.classList.remove('hidden');
      }
    }

    function canUpload() {
      const start = getTrialStart();
      return start && getDaysLeft() > 0;
    }

    startTrialButton.addEventListener('click', () => {
      setTrialStart();
      renderTrialState();
    });

    upgradeButton.addEventListener('click', () => {
      window.open('https://github.com/STAR-cpu448/bstar-gr-code', '_blank');
    });

    uploadForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!imageInput.files.length) {
        alert('Please choose an image file.');
        return;
      }

      if (!canUpload()) {
        const start = getTrialStart();
        if (!start) {
          alert('Start your free trial first to begin uploading.');
        } else {
          alert('Your trial is over. Please upgrade to continue.');
        }
        return;
      }

      setLoading(true);

      try {
        const formData = new FormData();
        formData.append('image', imageInput.files[0]);

        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Upload failed');
        }

        imageLink.href = data.imageUrl;
        imageLink.textContent = data.imageUrl;
        qrImage.src = data.qrDataUrl;
        resultSection.classList.remove('hidden');
      } catch (err) {
        alert(err.message || 'Upload failed.');
      } finally {
        setLoading(false);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') document.body.classList.add('keyboard-focus');
    });

    renderTrialState();
  </script>
</body>
</html>
