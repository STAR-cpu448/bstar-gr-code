<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WEBCODE — Fresh</title>
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#071226">
</head>
<body>
  <div class="stage">
    <div class="card">
      <div class="brand"><h1>WEBCODE</h1><p class="lead">Image → QR · 3-day free trial</p></div>
      <form id="uploadForm" class="form">
        <label class="field"><span class="label">Image</span><input type="file" name="file" accept="image/*" required></label>
        <div class="row"><label class="field small"><span class="label">Email</span><input name="email" type="email"></label><label class="field small"><span class="label">Phone</span><input name="phone" type="tel"></label></div>
        <label class="field"><span class="label">Admin key (optional)</span><input name="adminKey" type="text"></label>
        <div class="actions"><button id="startTrial" type="button" class="pill ghost">Start 3-day Trial</button><button id="uploadBtn" type="submit" class="pill primary">Generate QR</button></div>
        <p id="status" class="status">Checking access…</p>
      </form>
      <div id="preview" class="preview hidden"><h3>QR Preview</h3><img id="qrImg"><a id="downloadLink" class="pill ghost" download>Download</a></div>
    </div>
  </div>

  <!-- Payment modal (hidden until trial expires) -->
  <div id="payModal" class="modal-overlay hidden" role="dialog" aria-hidden="true">
    <div class="modal-sheet">
      <h3>Unlock WEBCODE — Permanent Access</h3>
      <p>3-day trial expired. Pay KSh 99 to unlock permanent access for this device. You can pay with M-Pesa (STK) or card.</p>
      <div class="modal-actions">
        <button id="payCancel" class="pill ghost">Cancel</button>
        <button id="payConfirm" class="pill primary">Pay KSh 99</button>
      </div>
    </div>
  </div>

  <script>
    const fingerprint = (localStorage.getItem('webcodeFingerprint') || crypto.randomUUID()); localStorage.setItem('webcodeFingerprint', fingerprint);
    async function getStatus(){ try{ const res = await fetch(`/api/trial/status?fingerprint=${encodeURIComponent(fingerprint)}`); return await res.json(); }catch(e){return {state:'unknown'} } }
    document.addEventListener('DOMContentLoaded', ()=>{
      const form = document.getElementById('uploadForm');
      const statusEl = document.getElementById('status');
      const preview = document.getElementById('preview');
      const qrImg = document.getElementById('qrImg');
      const downloadLink = document.getElementById('downloadLink');
      const payModal = document.getElementById('payModal');
      const payConfirm = document.getElementById('payConfirm');
      const payCancel = document.getElementById('payCancel');

      async function refreshStatus(){
        const email = form.email.value || '';
        const phone = form.phone.value || '';
        const adminKey = form.adminKey.value || '';
        const res = await fetch(`/api/trial/status?fingerprint=${encodeURIComponent(fingerprint)}&email=${encodeURIComponent(email)}&phone=${encodeURIComponent(phone)}&adminKey=${encodeURIComponent(adminKey)}`);
        return res.json();
      }

      document.getElementById('startTrial').addEventListener('click', async ()=>{
        const email = form.email.value||''; const phone = form.phone.value||''; const adminKey = form.adminKey.value||'';
        await fetch('/api/trial/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fingerprint,email,phone,adminKey})});
        alert('Trial started'); statusEl.textContent='Trial started';
      });

      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(form); fd.append('fingerprint', fingerprint);
        const res = await fetch('/upload',{method:'POST',body:fd});
        if(res.status===200){ const j=await res.json(); qrImg.src = j.qrDataUrl; downloadLink.href = j.qrDataUrl; preview.classList.remove('hidden'); }
        else if(res.status===402 || res.status===403){
          // trial expired or locked — show payment modal
          payModal.classList.remove('hidden'); payModal.setAttribute('aria-hidden','false');
        } else { alert('Upload failed'); }
      });

      payConfirm.addEventListener('click', async ()=>{
        const email = form.email.value||''; const phone = form.phone.value||''; const adminKey = form.adminKey.value||'';
        const r = await fetch('/api/payments/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fingerprint,email,phone,adminKey,amount:9900})});
        const j = await r.json();
        if(j.authorization_url){ window.open(j.authorization_url,'_blank'); }
        payModal.classList.add('hidden'); payModal.setAttribute('aria-hidden','true');
        // poll for payment
        const poll = setInterval(async ()=>{ const s = await refreshStatus(); if(s.paid){ clearInterval(poll); alert('Payment confirmed — access unlocked'); } }, 3000);
      });

      payCancel.addEventListener('click', ()=>{ payModal.classList.add('hidden'); payModal.setAttribute('aria-hidden','true'); });

      // initial check
      refreshStatus().then(s=>{ if(s.paid) statusEl.textContent='Paid'; else if(s.state==='trial') statusEl.textContent = `Trial: ${s.daysLeft || 3} day(s)`; else if(s.state==='expired') { statusEl.textContent='Trial expired'; payModal.classList.remove('hidden'); payModal.setAttribute('aria-hidden','false'); } else statusEl.textContent='No active trial'; });
    });
  </script>
</body>
</html>
